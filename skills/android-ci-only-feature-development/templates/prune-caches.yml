name: Prune caches

# Salin ke .github/workflows/ di repo yang CI-nya kehabisan kuota penyimpanan.
# Kuota Actions dihitung dari cache juga, dan cache Gradle Android menumpuk
# tiap commit (~100 MB per key, key memuat hash dependensi sehingga selalu
# baru) sampai langkah unggah artefak ditolak:
#   "Artifact storage quota has been hit"
# padahal seluruh langkah build di job yang sama sukses. Cache yang dihapus
# selalu bisa dibangun ulang; build berikutnya hanya mengunduh dependensi
# sekali lagi.
#
# WAJIB ada di cabang default: workflow `schedule` tidak dijalankan dari cabang
# fitur, dan tidak ada error yang memberitahu kalau salah cabang. Repo yang
# tidak aktif 60 hari kehilangan jadwalnya (aturan GitHub) - pakai
# workflow_dispatch manual kalau begitu.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches older than 3 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '3 days ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "menghapus cache lebih tua dari $cutoff"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.created_at < \"$cutoff\") | .id" \
          | while read -r id; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/caches/$id"
              echo "dihapus: $id"
            done
          # Baris terakhir ini bukti yang bisa dibaca: cache/usage sendiri masih
          # lag beberapa jam setelah penghapusan, jadi log ini yang menunjukkan
          # angka yang benar-benar tersisa di repo ini.
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" \
            --jq '"sisa: \(.active_caches_count) entri, \(.active_caches_size_in_bytes/1048576|floor) MB"'
