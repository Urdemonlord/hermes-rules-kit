mode: assist  # watch | assist | autopilot

monitoring:
  active_interval: "every 15m"
  blocked_interval: "every 60m"
  completed_interval: "every 24h"
  failure_backoff_max: "every 4h"

budgets:
  warn_threshold_pct: 70
  slowdown_threshold_pct: 85
  hard_stop_threshold_pct: 100

resume_policy:
  max_retries_per_stage: 2
  allow_safe_mode: true
  allow_recovery_mode: true
  max_repeated_verify_fail_cycles: 2

safety:
  stop_lock_filename: ".stop-lock"
  require_artifact_validation: true
  allow_destructive_autoresume: false

reporting:
  daily_report_time_utc: "09:00"
  delivery: origin
  include_top_risk_missions: 5
