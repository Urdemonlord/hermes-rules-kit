# Admin panel on loopback, exposed at a subdomain behind HTTP Basic.
#
# Setup order matters — do not install this file first:
#   1. DNS A record (proxied:true is fine here; certbot uses webroot over HTTP)
#   2. Install an HTTP-only vhost, reload, run certbot  (see SKILL.md)
#   3. Install THIS file, sudo nginx -t && sudo systemctl reload nginx
#   4. Start the app under pm2/systemd
#
# Requires:
#   /etc/nginx/<name>.htpasswd      0640 root:root  (openssl passwd -6 works; no apache2-utils needed)
#   /etc/nginx/<name>-secret.inc    0600 root:root  (contains: set $app_secret "<value>";)
#   fail2ban jail [nginx-http-auth] enabled  — Basic has no lockout of its own

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Password-only gate. No lockout, no per-user revocation — the fail2ban jail
    # is the lockout. Do not remove one without replacing the other.
    auth_basic           "panel";
    auth_basic_user_file /etc/nginx/<name>.htpasswd;

    add_header X-Frame-Options "DENY"           always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer"    always;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # BOTH directives must be inside this location. proxy_set_header is
        # resolved at config parse time, so a `set` in server{} is registered too
        # late and nginx -t fails with: unknown "<var>" variable.
        # The secret stays out of sites-enabled/ so grep -r cannot leak it.
        include /etc/nginx/<name>-secret.inc;
        proxy_set_header x-app-secret $app_secret;

        proxy_read_timeout    60s;
        proxy_connect_timeout 5s;
    }
}

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    # Keep this reachable or `certbot renew --webroot` fails silently later.
    # ^~ beats any regex location that would otherwise match the challenge path.
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; allow all; }
    location / { return 301 https://$host$request_uri; }
}